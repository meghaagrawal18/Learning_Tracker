spring.application.name=learning-tracker-api
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/tracker;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Initial coordinator comes from environment variables, never from source code
app.coordinator.email=${COORDINATOR_EMAIL:}
app.coordinator.password=${COORDINATOR_PASSWORD:}
server.servlet.session.cookie.name=TRACKER_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m